<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | SuperMart</title>
<meta name="description" content="Create a free SuperMart account to start saving on weekly grocery deals.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dark-mode.css">
<link rel="stylesheet" href="../assets/css/rtl.css">
<link rel="stylesheet" href="../assets/css/features.css">
<link rel="stylesheet" href="../assets/css/enhance.css">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<style>
.auth-page{min-height:100vh;display:flex;flex-direction:column;}
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;background:var(--color-section,#f8f8f8);}
.auth-card{max-width:520px;width:100%;background:var(--color-card,#fff);border-radius:24px;box-shadow:0 16px 56px rgba(0,0,0,.11);padding:44px 48px;}
@media(max-width:560px){.auth-card{padding:32px 24px;border-radius:18px;}}
/* Brand row inside card */
.auth-brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--color-border,#eee);}
.auth-brand{font-family:'Nunito',sans-serif;font-size:1.6rem;font-weight:800;color:var(--color-primary,#E63946);text-decoration:none;display:flex;align-items:center;gap:8px;}
.auth-brand i{font-size:1.5rem;}
.auth-card h1{font-size:1.75rem;font-family:'Nunito',sans-serif;font-weight:800;margin-bottom:4px;}
.auth-card .sub{color:#888;margin-bottom:28px;font-size:15px;}
.auth-card .form-control{height:50px;border-radius:10px;font-size:15px;}
.auth-card .btn-danger{height:50px;border-radius:10px;font-weight:700;width:100%;font-size:16px;}
.auth-switch{text-align:center;margin-top:20px;color:#777;font-size:14px;}
.social-divider{display:flex;align-items:center;gap:12px;color:#999;font-size:13px;margin:24px 0 20px;}
.social-divider::before,.social-divider::after{content:'';flex:1;border-top:1px solid var(--color-border,#e0e0e0);}
.social-btn{height:46px;border-radius:10px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid #ddd;background:#fff;color:#333;transition:.2s;}
.social-btn:hover{border-color:#aaa;background:#fafafa;}
body.dark-mode .social-btn{background:#2a2a2a;border-color:#444;color:#e8e8e8;}
body.dark-mode .social-btn:hover{background:#333;}
.auth-icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--color-border,#ccc);background:var(--color-section,#f4f4f4);color:var(--color-text,#333);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:15px;}
.auth-icon-btn:hover{background:var(--color-primary,#E63946);color:#fff;border-color:var(--color-primary,#E63946);}
body.dark-mode .auth-icon-btn{border-color:#444;background:#2a2a2a;color:#e8e8e8;}
</style>
</head>
<body>

<div class="auth-page">
<main class="auth-main" id="main-content">
<div class="auth-card">

<!-- Brand + Icons inside card -->
<div class="auth-brand-row">
  <a href="index.html" class="auth-brand">
    <i class="fa-solid fa-basket-shopping"></i>SuperMart
  </a>
  <div class="d-flex align-items-center gap-2">
    <button id="rtlToggle" class="auth-icon-btn" aria-label="Toggle RTL" title="Switch direction"><i class="fa-solid fa-arrow-left-long"></i></button>
    <button id="themeToggle" class="auth-icon-btn" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
  </div>
</div>

<h1>Create Your Account</h1>
<p class="sub">Join SuperMart and unlock weekly member-only deals.</p>

<!-- Social Sign Up (at top, before form) -->
<div class="d-flex gap-3 mb-4">
<button type="button" class="social-btn flex-fill" onclick="showToast('Google sign-up is coming soon. Please register with email &amp; password.','info')">
  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google"> Google
</button>
<button type="button" class="social-btn flex-fill" onclick="showToast('Apple sign-up is coming soon. Please register with email &amp; password.','info')">
  <i class="fab fa-apple" style="font-size:18px;"></i> Apple
</button>
</div>

<div class="social-divider">or sign up with email</div>

<form id="registerForm" novalidate>
<div class="mb-3">
<label class="form-label fw-semibold" for="regName">Full Name</label>
<input type="text" class="form-control" id="regName" required placeholder="Jane Doe">
</div>
<div class="mb-3">
<label class="form-label fw-semibold" for="regEmail">Email Address</label>
<input type="email" class="form-control" id="regEmail" required placeholder="you@example.com">
</div>
<div class="mb-3">
<label class="form-label fw-semibold" for="regPhone">Phone Number</label>
<input type="tel" class="form-control" id="regPhone" required placeholder="98765 43210">
</div>
<div class="mb-4">
<label class="form-label fw-semibold" for="regPassword">Password</label>
<input type="password" class="form-control" id="regPassword" required placeholder="At least 4 characters" minlength="4">
</div>
<button type="submit" class="btn btn-danger">Create Account</button>
</form>

<div class="auth-switch">Already have an account? <a href="login.html" class="text-danger fw-bold">Login</a></div>
</div>
</main>

</div>

<div class="sm-toast" id="smToast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/features.js"></script>
<script>

document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPassword').value.trim();

  if(name.length < 2){ showToast('Please enter your full name.','error'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Please enter a valid email address.','error'); return; }
  if(!/^[0-9+\-\s]{7,15}$/.test(phone)){ showToast('Please enter a valid phone number.','error'); return; }
  if(pass.length < 4){ showToast('Password must be at least 4 characters.','error'); return; }

  const users = JSON.parse(localStorage.getItem('smUsers')||'[]');
  if(users.some(u=>u.email.toLowerCase()===email.toLowerCase())){
    showToast('An account with this email already exists. Please login instead.','error');
    return;
  }
  users.push({name, email, phone, password:pass});
  localStorage.setItem('smUsers', JSON.stringify(users));
  localStorage.setItem('smUser', JSON.stringify({name, email}));
  showToast('Account created successfully!','success');
  setTimeout(()=>{ window.location.href = 'index.html'; }, 1200);
});
</script>

</body>
</html>
