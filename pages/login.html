<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SuperMart</title>
<meta name="description" content="Login to your SuperMart account to track orders, manage your wishlist and checkout faster.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dark-mode.css">
<link rel="stylesheet" href="../assets/css/rtl.css">
<link rel="stylesheet" href="../assets/css/features.css">
<link rel="stylesheet" href="../assets/css/enhance.css">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<style>
/* ── AUTH PAGE LAYOUT ── */
.auth-page{min-height:100vh;display:flex;flex-direction:column;}
.auth-header{border-bottom:1px solid var(--color-border,#eee);background:var(--color-bg,#fff);padding:16px 0;}
.auth-header .brand{font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:800;color:var(--color-primary,#E63946);text-decoration:none;}
.auth-header .brand i{color:var(--color-primary,#E63946);}
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px;background:var(--color-section,#f8f8f8);}
.auth-card{max-width:440px;width:100%;background:var(--color-card,#fff);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.09);padding:44px 40px;}
@media(max-width:480px){.auth-card{padding:32px 24px;}}
.auth-card h1{font-size:1.65rem;font-family:'Nunito',sans-serif;font-weight:800;margin-bottom:4px;}
.auth-card .sub{color:#888;margin-bottom:28px;font-size:15px;}
.auth-card .form-control{height:48px;border-radius:10px;font-size:15px;}
.auth-card .btn-danger{height:48px;border-radius:10px;font-weight:700;width:100%;font-size:16px;}
.auth-switch{text-align:center;margin-top:20px;color:#777;font-size:14px;}
/* Social Login */
.social-divider{display:flex;align-items:center;gap:12px;color:#999;font-size:13px;margin:24px 0 20px;}
.social-divider::before,.social-divider::after{content:'';flex:1;border-top:1px solid var(--color-border,#e0e0e0);}
.social-btn{height:46px;border-radius:10px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid #ddd;background:#fff;color:#333;transition:.2s;}
.social-btn:hover{border-color:#aaa;background:#fafafa;}
body.dark-mode .social-btn{background:#2a2a2a;border-color:#444;color:#e8e8e8;}
body.dark-mode .social-btn:hover{background:#333;}
.auth-footer{text-align:center;padding:20px;color:#999;font-size:13px;}
.auth-icon-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--color-border,#ddd);background:transparent;color:var(--color-text,#333);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:14px;}
.auth-icon-btn:hover{background:var(--color-primary,#E63946);color:#fff;border-color:var(--color-primary,#E63946);}
body.dark-mode .auth-icon-btn{border-color:#444;color:#e8e8e8;}
</style>
</head>
<body>

<!-- Minimal Auth Header -->
<div class="auth-page">
<header class="auth-header">
<div class="container" style="position:relative;">
<a href="index.html" class="brand d-block text-center">
  <i class="fa-solid fa-basket-shopping me-1"></i>SuperMart
</a>
<div class="d-flex align-items-center gap-2" style="position:absolute;top:50%;right:0;transform:translateY(-50%);">
<button id="rtlToggle" class="auth-icon-btn" aria-label="Toggle RTL" title="Switch direction"><i class="fa-solid fa-arrow-left-long"></i></button>
<button id="themeToggle" class="auth-icon-btn" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
</div>
</div>
</header>

<main class="auth-main" id="main-content">
<div class="auth-card">
<h1>Welcome Back</h1>
<p class="sub">Login to track orders and get faster checkout.</p>

<form id="loginForm" novalidate>
<div class="mb-3">
<label class="form-label fw-semibold" for="loginEmail">Email Address</label>
<input type="email" class="form-control" id="loginEmail" required placeholder="you@example.com">
</div>
<div class="mb-4">
<label class="form-label fw-semibold" for="loginPassword">Password</label>
<input type="password" class="form-control" id="loginPassword" required placeholder="Enter your password" minlength="4">
</div>
<button type="submit" class="btn btn-danger">Login</button>
</form>

<!-- Social Sign In -->
<div class="social-divider">or continue with</div>
<div class="d-flex gap-3">
<button type="button" class="social-btn flex-fill" onclick="showToast('Google sign-in is coming soon. Please use email &amp; password.','info')">
  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google"> Google
</button>
<button type="button" class="social-btn flex-fill" onclick="showToast('Apple sign-in is coming soon. Please use email &amp; password.','info')">
  <i class="fab fa-apple" style="font-size:18px;"></i> Apple
</button>
</div>

<div class="auth-switch">Don't have an account? <a href="register.html" class="text-danger fw-bold">Register</a></div>
</div>
</main>

</div>

<div class="sm-toast" id="smToast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/features.js"></script>
<script>

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Please enter a valid email address.','error'); return; }
  if(pass.length < 4){ showToast('Password must be at least 4 characters.','error'); return; }

  const users = JSON.parse(localStorage.getItem('smUsers')||'[]');
  let user = users.find(u=>u.email.toLowerCase()===email.toLowerCase());
  if(!user){
    user = {name:email.split('@')[0], email, password:pass};
    users.push(user);
    localStorage.setItem('smUsers', JSON.stringify(users));
  } else if(user.password !== pass){
    showToast('Incorrect password.','error');
    return;
  }
  localStorage.setItem('smUser', JSON.stringify({name:user.name, email:user.email}));
  showToast('Login successful!','success');
  setTimeout(()=>{ window.location.href = 'index.html'; }, 1200);
});
</script>

</body>
</html>
